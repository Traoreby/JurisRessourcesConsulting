name: Deploy Supabase Migrations

on:
  push:
    branches:
      - master # Exécute le workflow uniquement lors d'un push sur 'master'
  workflow_dispatch: # Permet de lancer le workflow manuellement depuis GitHub

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Migrations
        # Link to the project using the SUPABASE_PROJECT_ID secret
        # Apply the migrations using the SUPABASE_DB_PASSWORD secret
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
